<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Admin Dashboard - Firebase</title>
    <!-- Chart.js untuk Grafik Interaktif -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #070a2d;
            --bg-card: #222431;
            --border-color: #3b4252;
            --accent-green: #00b377;
            --accent-green-hover: #008c5d;
            --accent-red: #ff4d4d;
            --accent-blue: #3b82f6;
            --text-main: #cdced5;
        }
        body {
            font-family: 'Work Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
        }
        .wrapper { max-width: 1000px; margin: auto; }
        
        /* Layar Login Sederhana */
        #login-screen {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 400px;
            margin: 80px auto;
        }
        
        /* Sembunyikan dashboard sebelum klik masuk */
        #dashboard-screen { display: none; }

        .header-flex {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;
        }
        
        /* Stats & Layout */
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; display: flex; align-items: center; gap: 15px; }
        .stat-icon { font-size: 40px; }
        .stat-info h4 { margin: 0; font-size: 14px; color: #a0a3bd; }
        .stat-info h2 { margin: 5px 0 0 0; font-size: 28px; color: white; }
        .content-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: var(--bg-card); padding: 25px; border-radius: 8px; border: 1px solid var(--border-color); }
        
        /* Form & Button */
        input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; background: var(--bg-main); border: 1px solid var(--border-color); color: white; border-radius: 4px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; width: 100%; }
        .btn-primary { background: var(--accent-green); }
        .btn-secondary { background: #4b5563; width: auto;}
        .btn-warning { background: var(--accent-blue); width: auto; font-size: 12px;}
        .btn-danger { background: var(--accent-red); width: auto; font-size: 12px;}
        
        .project-row { background: var(--bg-main); border: 1px solid var(--border-color); padding: 15px; margin-bottom: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <!-- LAYAR LOGIN ADMIN -->
    <div id="login-screen">
        <h2>Admin Login</h2>
        <p style="font-size: 13px; margin-bottom: 20px;">Sistem Database Cloud Firebase</p>
        <input type="password" id="admin-pass" placeholder="Masukkan Sandi (bebas)">
        <button class="btn-primary" onclick="handleLogin()">Masuk Dashboard</button>
        <p id="login-error" style="color: var(--accent-red); font-size: 12px; margin-top: 10px;"></p>
    </div>

    <!-- DASHBOARD UTAMA -->
    <div id="dashboard-screen" class="wrapper">
        <div class="header-flex">
            <h2 style="margin: 0;">💻 Dashboard Admin - Firebase</h2>
            <button class="btn-secondary" onclick="handleLogout()">Logout</button>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">📁</div>
                <div class="stat-info"><h4>Total Project</h4><h2 id="total-projects">0</h2></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-info"><h4>Database Cloud</h4><h2 style="color: var(--accent-green); font-size: 20px; margin-top: 8px;">Firestore</h2></div>
            </div>
        </div>

        <div class="content-grid">
            <!-- Form Tambah / Edit Project -->
            <div class="card">
                <h3 style="margin-top:0;" id="form-title">Tambah Project</h3>
                <form id="projectForm">
                    <input type="hidden" id="project-id">
                    <label>Judul Project</label>
                    <input type="text" id="title" required>
                    <label>Deskripsi Singkat</label>
                    <textarea id="description" rows="3" required></textarea>
                    <label>URL / Link Github</label>
                    <input type="text" id="repository_url" required>
                    <label>Tools (Pisahkan koma)</label>
                    <input type="text" id="tools" placeholder="Contoh: HTML, CSS, JS" required>
                    <button type="submit" class="btn-primary" id="submit-btn">Simpan Data</button>
                </form>
            </div>

            <div>
                <!-- Grafik Statistik -->
                <div class="card" style="margin-bottom: 20px;">
                    <h3 style="margin-top:0;">Grafik Statistik Project</h3>
                    <canvas id="myChart" height="90"></canvas>
                </div>
                <!-- Daftar Manajemen Project -->
                <div class="card">
                    <h3 style="margin-top:0;">Manajemen Project</h3>
                    <div id="admin-project-list"><i>Memuat data dari Firebase...</i></div>
                </div>
            </div>
        </div>
    </div>

    <!-- SKRIP UTAMA FIREBASE & DASHBOARD -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            addDoc, 
            deleteDoc, 
            doc, 
            updateDoc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // === MASUKKAN KONFIGURASI FIREBASE KAMU DI SINI ===
        const firebaseConfig = {
            apiKey: "MASUKKAN_API_KEY_KAMU",
            authDomain: "MASUKKAN_AUTH_DOMAIN_KAMU",
            projectId: "MASUKKAN_PROJECT_ID_KAMU",
            storageBucket: "MASUKKAN_STORAGE_BUCKET_KAMU",
            messagingSenderId: "MASUKKAN_MESSAGING_SENDER_ID_KAMU",
            appId: "MASUKKAN_APP_ID_KAMU"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- 1. SISTEM OTENTIKASI SEDERHANA ---
        window.addEventListener('DOMContentLoaded', () => {
            const isLogged = localStorage.getItem('isAdminLoggedIn');
            if (isLogged === 'true') {
                showDashboard();
            }
        });

        window.handleLogin = function() {
            const pass = document.getElementById('admin-pass').value;
            // Ganti sandi admin sesuai keinginan di sini (misal: "smekda123")
            if (pass === "smekda123") {
                localStorage.setItem('isAdminLoggedIn', 'true');
                showDashboard();
            } else {
                document.getElementById('login-error').textContent = '❌ Sandi salah!';
            }
        }

        window.handleLogout = function() {
            localStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'block';
            loadDataAndStats();
        }

        // --- 2. GRAFIK STATISTIK (CHART.JS) ---
        let analyticsChart;
        function initChart(projectsCount) {
            const ctx = document.getElementById('myChart').getContext('2d');
            if (analyticsChart) {
                analyticsChart.data.datasets[0].data = [projectsCount];
                analyticsChart.update();
            } else {
                analyticsChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Total Project Tersimpan'],
                        datasets: [{ 
                            label: 'Jumlah', 
                            data: [projectsCount], 
                            backgroundColor: ['#3b82f6'], 
                            borderRadius: 5 
                        }]
                    },
                    options: { 
                        responsive: true, 
                        scales: { 
                            y: { beginAtZero: true, ticks: { color: '#cdced5', stepSize: 1 } }, 
                            x: { ticks: { color: '#cdced5' } } 
                        }, 
                        plugins: { legend: { display: false } } 
                    }
                });
            }
        }

        // --- 3. CRUD & LOAD DATA DARI FIRESTORE ---
        const form = document.getElementById('projectForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('project-id').value;
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const repository_url = document.getElementById('repository_url').value;
            const toolsInput = document.getElementById('tools').value;
            
            // Ubah tools dari string koma jadi array
            const tools = toolsInput.split(',').map(t => t.trim());

            try {
                if (id) {
                    // Update data (PUT)
                    const projectRef = doc(db, "projects", id);
                    await updateDoc(projectRef, { title, description, repository_url, tools });
                    alert('✅ Project berhasil diperbarui!');
                } else {
                    // Tambah data baru (POST)
                    await addDoc(collection(db, "projects"), {
                        title,
                        description,
                        repository_url,
                        tools,
                        created_at: serverTimestamp()
                    });
                    alert('✅ Project berhasil ditambahkan!');
                }

                form.reset();
                document.getElementById('project-id').value = '';
                document.getElementById('submit-btn').textContent = 'Simpan Data';
                document.getElementById('form-title').textContent = 'Tambah Project';
                loadDataAndStats();
            } catch (error) {
                console.error("Gagal menyimpan data:", error);
                alert('❌ Gagal menyimpan data ke database.');
            }
        });

        async function loadDataAndStats() {
            const list = document.getElementById('admin-project-list');
            try {
                const querySnapshot = await getDocs(collection(db, "projects"));
                list.innerHTML = '';
                
                let totalProjects = 0;

                querySnapshot.forEach(docSnap => {
                    totalProjects++;
                    const p = docSnap.data();
                    const pId = docSnap.id;
                    const toolsStr = Array.isArray(p.tools) ? p.tools.join(', ') : (p.tools || '');

                    list.innerHTML += `
                        <div class="project-row">
                            <div>
                                <strong style="color:white">${p.title}</strong>
                                <p style="margin:5px 0 0 0; font-size:13px; color:#a0a3bd">${p.description}</p>
                            </div>
                            <div style="display: flex; gap: 5px;">
                                <button class="btn-warning" type="button" onclick="window.prepareEdit('${pId}', '${p.title.replace(/'/g, "\\'")}', '${p.description.replace(/'/g, "\\'")}', '${p.repository_url || ''}', '${toolsStr}')">Edit</button>
                                <button class="btn-danger" type="button" onclick="window.removeData('${pId}')">Hapus</button>
                            </div>
                        </div>
                    `;
                });

                if (totalProjects === 0) {
                    list.innerHTML = '<i>Belum ada project di database.</i>';
                }

                // Update angka statistik & grafik
                document.getElementById('total-projects').textContent = totalProjects;
                initChart(totalProjects);

            } catch (error) {
                console.error("Gagal memuat data:", error);
                list.innerHTML = 'Gagal memuat data dari cloud.';
            }
        }

        // Fungsi bantu untuk tombol Edit
        window.prepareEdit = function(id, title, desc, repo, tools) {
            document.getElementById('project-id').value = id;
            document.getElementById('title').value = title;
            document.getElementById('description').value = desc;
            document.getElementById('repository_url').value = repo;
            document.getElementById('tools').value = tools;
            document.getElementById('form-title').textContent = 'Edit Project: ' + title;
            document.getElementById('submit-btn').textContent = 'Perbarui Data';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Fungsi hapus data
        window.removeData = async function(id) {
            if(confirm('Yakin ingin menghapus project ini dari Firebase?')) {
                try {
                    await deleteDoc(doc(db, "projects", id));
                    alert('✅ Project berhasil dihapus!');
                    loadDataAndStats();
                } catch (error) {
                    console.error("Gagal menghapus:", error);
                    alert('❌ Gagal menghapus project.');
                }
            }
        }

        // Jalankan fungsi load saat halaman dibuka
        loadDataAndStats();
    </script>
</body>
</html>
